<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok | CIBD Editor — Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #FAF9F6; --surface-raised: #FFFFFF; --surface-sunken: #F2F1EC;
    --rule-strong: #D2CFC6;
    --ink-strong: #2A2E35; --ink: #3B404A; --ink-muted: #6E737B; --ink-faint: #9CA1A8;
    --accent: #4B8A89; --accent-strong: #356C6A; --accent-ink: #2C5D5B; --accent-wash: #EAF2F1;
    --success: #1A7F4B; --success-wash: #EBF7F1;
    --radius-2: 4px; --radius-3: 8px;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  body { display: flex; align-items: center; justify-content: center; }

  .card {
    background: var(--surface-raised); border: 1px solid var(--rule-strong);
    border-radius: var(--radius-3); padding: 40px 36px; width: 100%; max-width: 400px;
  }
  .logo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 18px; font-weight: 600; color: var(--ink-strong); margin-bottom: 8px; }
  .desc { font-size: 13px; color: var(--ink-muted); margin-bottom: 24px; line-height: 1.5; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-bottom: 5px; }
  .field { margin-bottom: 16px; }
  input[type="email"] {
    width: 100%; padding: 9px 11px;
    background: var(--surface-sunken); border: 1px solid var(--rule-strong);
    border-radius: var(--radius-2); font-family: var(--sans); font-size: 13px;
    color: var(--ink); outline: none; transition: border-color 150ms;
  }
  input:focus { border-color: var(--accent); background: var(--surface-raised); }

  .btn-primary {
    width: 100%; padding: 10px; margin-top: 8px;
    background: var(--accent-strong); border: none; border-radius: var(--radius-2);
    color: #fff; font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 150ms;
  }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .back-link { display: block; margin-top: 16px; text-align: center; font-size: 12px; color: var(--ink-muted); text-decoration: none; }
  .back-link:hover { color: var(--accent-ink); }

  .success-box {
    background: var(--success-wash); border: 1px solid #a3d9be;
    border-radius: var(--radius-2); padding: 12px 14px;
    color: var(--success); font-size: 13px; line-height: 1.5; display: none; margin-top: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Stok Building Intelligence</div>
  <h1>Forgot password</h1>
  <p class="desc">Enter your email address and we'll send you a link to reset your password.</p>

  <form id="forgotForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required placeholder="you@stok.com">
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
  </form>

  <div class="success-box" id="successBox">
    If that email is registered, a reset link has been sent. Check your inbox (and spam folder).
    The link expires in 1 hour.
  </div>

  <a class="back-link" href="/login.html">← Back to sign in</a>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });
  } finally {
    // Always show success to prevent user enumeration
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  }
});
</script>
</body>
</html>
