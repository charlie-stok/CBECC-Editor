<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok | CIBD Editor — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #FAF9F6; --surface-raised: #FFFFFF; --surface-sunken: #F2F1EC;
    --rule-strong: #D2CFC6;
    --ink-strong: #2A2E35; --ink: #3B404A; --ink-muted: #6E737B;
    --accent: #4B8A89; --accent-strong: #356C6A; --accent-ink: #2C5D5B;
    --error: #C0392B; --error-wash: #FDF2F0;
    --success: #1A7F4B; --success-wash: #EBF7F1;
    --radius-2: 4px; --radius-3: 8px;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  body { display: flex; align-items: center; justify-content: center; }

  .card {
    background: var(--surface-raised); border: 1px solid var(--rule-strong);
    border-radius: var(--radius-3); padding: 40px 36px; width: 100%; max-width: 400px;
  }
  .logo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 18px; font-weight: 600; color: var(--ink-strong); margin-bottom: 24px; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-bottom: 5px; }
  .field { margin-bottom: 16px; }
  input[type="password"] {
    width: 100%; padding: 9px 11px;
    background: var(--surface-sunken); border: 1px solid var(--rule-strong);
    border-radius: var(--radius-2); font-family: var(--sans); font-size: 13px;
    color: var(--ink); outline: none; transition: border-color 150ms;
  }
  input:focus { border-color: var(--accent); background: var(--surface-raised); }

  .btn-primary {
    width: 100%; padding: 10px; margin-top: 8px;
    background: var(--accent-strong); border: none; border-radius: var(--radius-2);
    color: #fff; font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 150ms;
  }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg {
    border-radius: var(--radius-2); padding: 11px 13px; font-size: 13px;
    line-height: 1.5; margin-top: 12px; display: none;
  }
  .msg.error { background: var(--error-wash); border: 1px solid #f5c6c3; color: var(--error); }
  .msg.success { background: var(--success-wash); border: 1px solid #a3d9be; color: var(--success); }

  .invalid-notice {
    text-align: center; color: var(--ink-muted); font-size: 13px; line-height: 1.6;
  }
  .invalid-notice a { color: var(--accent-ink); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Stok Building Intelligence</div>
  <h1>Set new password</h1>

  <div id="invalidNotice" class="invalid-notice" style="display:none">
    This reset link is invalid or has expired.<br>
    <a href="/forgot-password.html">Request a new one →</a>
  </div>

  <form id="resetForm" style="display:none">
    <div class="field">
      <label for="password">New password <span style="font-weight:400;color:var(--ink-muted)">(min 8 characters)</span></label>
      <input type="password" id="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Set new password</button>
    <div class="msg error" id="errorMsg"></div>
  </form>

  <div class="msg success" id="successMsg">
    Password updated. <a href="/login.html" style="color:var(--success);font-weight:600;">Sign in →</a>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  document.getElementById('invalidNotice').style.display = 'block';
} else {
  document.getElementById('resetForm').style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block'; return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    if (!r.ok) {
      const d = await r.json();
      if (r.status === 400 && d.error.includes('invalid or has expired')) {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('invalidNotice').style.display = 'block';
      } else {
        throw new Error(d.error || 'Reset failed');
      }
      return;
    }
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Set new password';
  }
});
</script>
</body>
</html>
